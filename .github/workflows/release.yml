name: Release

# Release: bump version in deno.json, then
#   git tag v<version> && git push origin v<version>
on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Version in deno.json matches the tag
        run: test "v$(jq -r .version deno.json)" = "$GITHUB_REF_NAME"
      - name: Build binaries
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            deno compile --allow-net=1.1.1.1,whois.ru --allow-env=CONS,VOWS,WHOIS_P --allow-read=/dev/tty,CONIN$ \
              --target "$target" -o "dist/domains-checker-$target" src/main.ts
          done
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

  jsr:
    # Needs the package on jsr.io linked to this repository (package settings → GitHub repository).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno publish
